spring:
  datasource:
    url: jdbc:h2:mem:clarops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS clarops_challenge_schema
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: clarops_challenge_schema
  docker:
    compose:
      enabled: false
